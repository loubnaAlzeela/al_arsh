name: zuvoxa
description: "ZUVOXA"
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Media & Files
  image_picker: ^1.1.2
  video_player: ^2.9.2
  file_picker: ^8.1.7

  # Images
  cached_network_image: ^3.4.1

  # SVG
  flutter_svg: ^2.0.17

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0

  # UI Enhancements
  shimmer: ^3.0.0
  percent_indicator: ^4.2.4
  lottie: ^3.3.1

  # Storage / File size check
  path_provider: ^2.1.5

  # Dotenv for local dev
  flutter_dotenv: ^5.2.1

  # UUID
  uuid: ^4.5.1
  visibility_detector: ^0.4.0+2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  in_app_purchase: ^3.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - .env

  # fonts:
  #   - family: Tajawal
  #     fonts:
  #       - asset: assets/fonts/Tajawal-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Tajawal-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Tajawal-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Tajawal-ExtraBold.ttf
  #         weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0f0f11"
  image: assets/images/splash_logo.png
  color_dark: "#0f0f11"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#0f0f11"
    image: assets/images/splash_logo.png
    color_dark: "#0f0f11"
    image_dark: assets/images/splash_logo.png
